name: Deploy to VPS

# Push to main or manual trigger:
#   1. Build the image on GitHub's own runner (no self-hosted runner needed)
#      and export it to a tarball
#   2. SCP it to the VPS
#   3. SSH in, load the image into the local Docker store, and tell minikube
#      to roll out the new image while leaving the secret (47 keys), configmap
#      (39 keys) and data PVC (1.9GB) untouched.
#
# The image is built with a default tag `omniroute:v1` AND a unique per-build
# tag `omniroute:v2-<commit>`. Using the unique tag in the deployment means
# `kubectl patch` always produces a real spec change, which forces a rolling
# restart of the pod against the freshly loaded image.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual deployment reason"
        required: true
        default: "Manual deploy"

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy OmniRoute
    runs-on: ubuntu-latest
    env:
      IMG_TAG: omniroute:v1
      # Unique tag per build forces a deployment rollout even on same-tag builds.
      DEPLOY_TAG: omniroute:v2-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image (build tag + unique deploy tag)
        run: |
          echo "Building $IMG_TAG ($DEPLOY_TAG) at $GITHUB_SHA"
          # --target runner-base matches the deployed image and skips the
          # runner-cli stage (line 68 installs npm packages that no longer
          # exist, which breaks the default full build).
          docker build --quiet --target runner-base -t $IMG_TAG .
          docker tag $IMG_TAG $DEPLOY_TAG
          docker images | grep -E "^omniroute"

      - name: Export image to tarball
        run: |
          mkdir -p deploy
          docker save -o deploy/omni-image.tar $DEPLOY_TAG
          gzip deploy/omni-image.tar
          ls -la deploy/omni-image.tar.gz

      - name: Fetch and verify VPS host key
        run: |
          mkdir -p .ssh
          ssh-keyscan ${{ secrets.VPS_HOST }} > .ssh/known_hosts
          echo "Fetched host key:"
          head -c 80 .ssh/known_hosts
          echo

      - name: Transfer image to server
        env:
          # Raw multi-line private key. Never let it touch shell expansion:
          # printenv writes it to a file byte-for-byte.
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          umask 077
          printenv SSH_KEY > /tmp/omni-deploy.key
          chmod 400 /tmp/omni-deploy.key
          [ -s /tmp/omni-deploy.key ] || { echo "key file empty"; exit 1; }
          scp -i /tmp/omni-deploy.key -o BatchMode=yes -o UserKnownHostsFile=.ssh/known_hosts \
            deploy/omni-image.tar.gz root@${{ secrets.VPS_HOST }}:/tmp/
          rm -f /tmp/omni-deploy.key
          echo "Image transferred to /tmp/omni-image.tar.gz"

      - name: Deploy via SSH (image only, data untouched)
        env:
          DEPLOY_TAG: ${{ env.DEPLOY_TAG }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 5m
          command_timeout: 20m
          envs: DEPLOY_TAG
          script: |
            echo "Deploying $DEPLOY_TAG"
            echo "=== 1. Restore image into local Docker store and minikube's containerd ==="
            # docker load puts it in the HOST docker store; minikube image load
            # is what makes it visible to the kubelet inside the minikube node
            # (imagePullPolicy: Never reads only from the node's local store).
            docker load -i /tmp/omni-image.tar.gz
            minikube image load /tmp/omni-image.tar.gz
            docker images | grep -E "omniroute:(v1|v2-[a-z0-9]+)" || echo "### image not found ###"

            echo "=== 2. Confirm current deployment spec ==="
            kubectl -n omniroute get deployment omniroute -o jsonpath='{range .spec.template.spec.containers[0]}{.image}{"\n"}{end}'

            echo "=== 3. Update image in the deployment (secret/configmap/PVC untouched) ==="
            kubectl -n omniroute patch deployment omniroute --type=strategic \
              -p '{"spec":{"template":{"spec":{"containers":[{"name":"omniroute","image":"'"$DEPLOY_TAG"'"}]}}}}'
            echo "=== 4. Wait for rollout to finish ==="
            kubectl -n omniroute rollout status deployment/omniroute --timeout=900s

            echo "=== 5. Internal health check (node inside pod) ==="
            kubectl -n omniroute exec deploy/omniroute -- node -e "
              fetch('http://127.0.0.1:20128/api/health')
                .then(r => r.text()).then(t => console.log('internal:', t)).catch(e => console.error('FAILED:', e.message));
              // no exit needed, this is inside a ephemeral check"

            echo "=== 6. Public health check (via domain/ingress) ==="
            curl -sk --max-time 30 https://omni.kraftstack.in/api/health || echo "### public health FAILED ###"

            echo "=== 7. Final pod state ==="
            kubectl -n omniroute get pods -o wide
            echo "=== deploy complete ==="

            echo "=== 8. Cleanup on server ==="
            rm -f /tmp/omni-image.tar.gz
